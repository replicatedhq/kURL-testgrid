name: deploy-testgrid

on:
  push:
    branches:
    - main

# Serialize releases so an older build cannot overwrite a newer deployment.
concurrency:
  group: deploy-testgrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-image-tgapi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - run: |
        docker build -f tgapi/deploy/Dockerfile \
          --build-arg "gitsha=${GITHUB_SHA:0:7}" \
          --build-arg buildtime="$(date --rfc-3339=seconds | sed 's/ /T/')" \
          -t "kxb4bdmwmg.registry.depot.dev/nzh4z2519m/tgapi:${GITHUB_SHA:0:7}" \
          .

    - uses: docker/login-action@v4
      with:
        registry: kxb4bdmwmg.registry.depot.dev
        username: x-token
        password: ${{ secrets.DEPOT_REGISTRY_TOKEN }}

    - run: docker push "kxb4bdmwmg.registry.depot.dev/nzh4z2519m/tgapi:${GITHUB_SHA:0:7}"

  deploy-latitude-tgapi:
    runs-on: ubuntu-latest
    needs: docker-image-tgapi
    steps:
    - uses: actions/checkout@v7

    - name: kustomize
      run: |
        curl -s https://api.github.com/repos/kubernetes-sigs/kustomize/releases/tags/v2.0.0 | \
          grep browser_download | \
          grep linux | \
          cut -d '"' -f 4 | \
          xargs sudo curl -O -L && \
          sudo mv kustomize_*_linux_amd64 /usr/local/bin/kustomize && \
          sudo chmod +x /usr/local/bin/kustomize
        for environment in staging production; do
          pushd "kustomize/overlays/latitude-${environment}"
          kustomize edit set image "kxb4bdmwmg.registry.depot.dev/nzh4z2519m/tgapi:${GITHUB_SHA:0:7}"
          kustomize build . > testgrid.yaml
          popd
        done

    - name: ssh-key
      env:
        GITOPS_DEPLOY_KEY: ${{ secrets.LATITUDE_GITOPS_DEPLOY_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$GITOPS_DEPLOY_KEY" > ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa
        echo 'github.com ssh-rsa ' \
          >> ~/.ssh/known_hosts

    - name: release
      run: |
        cd ~ && git clone --single-branch -b main git@github.com:replicatedhq/gitops-deploy
        cd ~/gitops-deploy
        for environment in staging production; do
          mkdir -p "${environment}/applications"
          cp "${GITHUB_WORKSPACE}/kustomize/overlays/latitude-${environment}/testgrid.yaml" "${environment}/applications/testgrid.yaml"
          git add "${environment}/applications/testgrid.yaml"
        done
        git config user.email "kurl-github-actions@replicated.com"
        git config user.name "kURL GitHub Actions"
        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m "https://github.com/replicatedhq/kURL-testgrid/actions/runs/${GITHUB_RUN_ID}"
        for attempt in 1 2 3 4 5; do
          git pull --rebase origin main
          if git push origin main; then
            exit 0
          fi
          sleep "$((attempt * 2))"
        done
        exit 1

  docker-image-tgrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tgrun-build
        run: |
          docker build -f tgrun/Dockerfile \
            --build-arg "gitsha=${GITHUB_SHA:0:7}" \
            --build-arg buildtime="$(date --rfc-3339=seconds | sed 's/ /T/')" \
            -t replicated/tgrun:latest \
            -t "replicated/tgrun:${GITHUB_SHA:0:7}" \
            .
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: tgrun-push
        run: |
          docker push replicated/tgrun:latest
          docker push "replicated/tgrun:${GITHUB_SHA:0:7}"
